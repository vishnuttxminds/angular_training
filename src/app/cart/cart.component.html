<p>cart works!</p>

<div *ngFor="let item of products" [ngSwitch]="getPriceCategory(item.price)">
  <p *ngSwitchCase="'AFFO'">
    {{ item.name }} - Amount: {{ item.price }} (Affordable)
  </p>

  <p *ngSwitchCase="'EXPE'">
    {{ item.name }} - Amount: {{ item.price }} (Expensive)
  </p>

  <p *ngSwitchDefault>
    {{ item.name }} - Amount: {{ item.price }} 
  </p>

</div>
