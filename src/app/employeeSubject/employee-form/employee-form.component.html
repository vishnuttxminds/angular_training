<!-- employee-form.component.html -->
<form #f="ngForm" (ngSubmit)="addEmployee(f)">
  <div>
    <label for="name">Name</label>
    <input id="name" name="name" ngModel required />
  </div>

  <div>
    <label for="department">Department</label>
    <input id="department" name="department" ngModel required />
  </div>

  <button type="submit" [disabled]="f.invalid">Add Employee</button>
</form>
